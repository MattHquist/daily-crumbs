<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Daily Crumbs Admin Login</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <main style="max-width:420px;margin:80px auto;padding:24px;">
    <section style="background:#fff;padding:28px;border:1px solid #d8d2c6;border-radius:10px;">
      <h1 style="margin-top:0;">Daily Crumbs</h1>
      <p>Admin Login</p>

      <form id="loginForm">
        <label>
          Email
          <input id="loginEmail" type="email" required>
        </label>

        <label>
          Password
          <input id="loginPassword" type="password" required>
        </label>

        <button type="submit">Sign In</button>

        <p id="loginMessage"></p>
      </form>
    </section>
  </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="login.js"></script>
</body>
</html>
